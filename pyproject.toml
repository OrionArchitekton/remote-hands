[project]
name = "remote-hands"
version = "0.2.0"
description = "Remote Hands: start Claude Code sessions in Cursor windows on a Windows PC, from an agent in WSL"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hands = "remote_hands.cli:main"
remote-hands-service = "remote_hands.server:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_hands"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S310"]
